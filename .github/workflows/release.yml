name: Release

# Create a GitHub Release with Windows / macOS / Linux installers on version tags.
#
#   # bump package.json version first (must match tag without leading v)
#   npm version patch
#   git push origin main --follow-tags
#
# Tag format: v0.1.6

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tag must match package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG must match package.json version $PKG. Bump package.json before tagging."
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            pack: pack:win
          - os: macos-latest
            platform: mac
            pack: pack:mac
          - os: ubuntu-latest
            platform: linux
            pack: pack:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json has npmRebuild:false; rebuild node-pty for this Electron ABI.
      - name: Rebuild native modules
        run: npm run rebuild:native

      - name: Typecheck & unit tests
        shell: bash
        run: |
          npm run typecheck
          npm run test:unit

      - name: Package ${{ matrix.platform }}
        shell: bash
        run: npm run ${{ matrix.pack }}
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          # Unsigned mac builds still produce dmg/zip (Gatekeeper warning for users).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List release output
        shell: bash
        run: |
          ls -la release || true
          find release -maxdepth 3 -type f 2>/dev/null | sort || true

      # Only ship installers — not ConPTY helpers like OpenConsole.exe that break gh-release uploads.
      # Use find (not brittle name globs) so "Anchor Code-…", "Anchor.Code-…", "Anchor-Code-…" all stage.
      - name: Stage installers for upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          case "${{ matrix.platform }}" in
            win)
              find release -maxdepth 1 -type f \( \
                -name '*.exe' -o -name '*.blockmap' -o -name 'latest.yml' \
              \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
                # Skip nested helper binaries if any ever land at top level
                base="$(basename "$f")"
                case "$base" in
                  OpenConsole.exe|elevate.exe) continue ;;
                esac
                cp -v "$f" staged/
              done
              ;;
            mac)
              find release -maxdepth 1 -type f \( \
                -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest-mac.yml' \
              \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
                cp -v "$f" staged/
              done
              ;;
            linux)
              find release -maxdepth 1 -type f \( \
                -name '*.AppImage' -o -name '*.deb' -o -name 'latest-linux.yml' \
              \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
                cp -v "$f" staged/
              done
              ;;
          esac
          echo "--- staged ---"
          ls -la staged || true
          count="$(find staged -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "staged file count=$count"
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::No installer artifacts staged for ${{ matrix.platform }}"
            exit 1
          fi

      - name: Upload artifacts to job
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: staged/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    # Publish whatever platforms succeeded (fail-fast is false on the matrix).
    needs: [verify, build]
    if: ${{ always() && !cancelled() && needs.verify.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist-packages
          pattern: packages-*
          merge-multiple: true

      - name: List downloaded files
        run: |
          find dist-packages -type f | sort
          test "$(find dist-packages -type f | wc -l)" -gt 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist-packages/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
