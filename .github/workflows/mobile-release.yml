name: Mobile Release

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Mobile version, for example 0.2.0
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: number

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION_CODE="${{ inputs.version_code }}"
          else
            VERSION="${GITHUB_REF_NAME#mobile-v}"
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Install mobile dependencies
        run: npm --prefix mobile/web ci
      - name: Install mobile browser baseline runtime
        run: npm --prefix mobile/web exec -- playwright install --with-deps chromium
      - name: Mobile baseline gate
        run: npm run mobile:baseline
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-playwright-report
          path: |
            mobile/web/playwright-report
            mobile/web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: npm --prefix mobile/web run build
      - name: Build independently versioned APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug -PanchorMobileVersionCode=${{ steps.version.outputs.code }} -PanchorMobileVersionName=${{ steps.version.outputs.name }}
      - name: Stage APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "Anchor-Mobile-${{ steps.version.outputs.name }}.apk"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        with:
          tag_name: ${{ github.ref_name }}
          name: Anchor Mobile ${{ steps.version.outputs.name }}
          files: Anchor-Mobile-${{ steps.version.outputs.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Anchor-Mobile-${{ steps.version.outputs.name }}
          path: Anchor-Mobile-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
