name: Release

# Create a GitHub Release with Windows installers when a version tag is pushed.
# Example:
#   npm version patch   # or edit package.json version
#   git push origin main --follow-tags
# Tag format: v0.1.1 (leading "v" required)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows & publish
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG must match package.json version $PKG. Bump package.json before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # package.json has npmRebuild:false; rebuild node-pty against this Electron ABI.
      - name: Rebuild native modules
        run: npm run rebuild:native

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm run test:unit

      - name: Build app + package (NSIS + portable)
        run: npm run pack:win
        env:
          # Silence electron-builder telemetry / download noise
          ELECTRON_GET_USE_PROXY: "true"
          # Cache electron binaries under the runner home when possible
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          # Draft first if you prefer review: draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
