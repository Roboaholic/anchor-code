name: Release

# Create / update a GitHub Release with Windows / macOS / Linux installers.
#
# Tag push (normal):
#   # bump package.json version first (must match tag without leading v)
#   npm version patch
#   git push origin main --follow-tags
#   Tag format: v0.1.11
#
# Manual re-run (no new tag) — e.g. rebuild only mac for an existing release:
#   Actions → Release → Run workflow
#   version: 0.1.11
#   platforms: mac  (or win / linux / all)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (must match package.json on main, e.g. 0.1.11)"
        required: true
        type: string
      platforms:
        description: "Which platforms to build"
        required: true
        type: choice
        default: mac
        options:
          - mac
          - win
          - linux
          - all

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.event.inputs.version) || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve version / tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
            VER="${VER#v}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "package.json=$PKG requested=$VER"
          if [ "$VER" != "$PKG" ]; then
            echo "::error::Requested version $VER must match package.json version $PKG on this checkout."
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            pack: pack:win
          - os: macos-latest
            platform: mac
            pack: pack:mac
          - os: ubuntu-latest
            platform: linux
            pack: pack:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Decide whether to build this platform
        id: want
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PLATFORMS="${{ github.event.inputs.platforms }}"
          if [ "$PLATFORMS" = "all" ] || [ "$PLATFORMS" = "${{ matrix.platform }}" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.platform }} (platforms=$PLATFORMS)"
          fi

      - name: Checkout
        if: steps.want.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.want.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.want.outputs.build == 'true'
        run: npm ci

      # package.json has npmRebuild:false; rebuild node-pty for this Electron ABI.
      - name: Rebuild native modules
        if: steps.want.outputs.build == 'true'
        run: npm run rebuild:native

      - name: Typecheck & unit tests
        if: steps.want.outputs.build == 'true'
        shell: bash
        run: |
          npm run typecheck
          npm run test:unit

      - name: Package ${{ matrix.platform }}
        if: steps.want.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "mac" ]; then
            # Unsigned CI builds: disable identity discovery and avoid
            # hardenedRuntime requirements that can abort electron-builder
            # with exit 134 on macos-latest when no Apple cert is present.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            export CSC_IDENTITY=""
            npm run pack:mac || {
              echo "::warning::mac package failed once; retrying once"
              npm run pack:mac
            }
          else
            npm run ${{ matrix.pack }}
          fi
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List release output
        if: steps.want.outputs.build == 'true'
        shell: bash
        run: |
          ls -la release || true
          find release -maxdepth 3 -type f 2>/dev/null | sort || true

      # Only ship installers — not ConPTY helpers like OpenConsole.exe that break gh-release uploads.
      # Use find (not brittle name globs) so "Anchor Code-…", "Anchor.Code-…", "Anchor-Code-…" all stage.
      - name: Stage installers for upload
        if: steps.want.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          case "${{ matrix.platform }}" in
            win)
              find release -maxdepth 1 -type f \( \
                -name '*.exe' -o -name '*.blockmap' -o -name 'latest.yml' \
              \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
                # Skip nested helper binaries if any ever land at top level
                base="$(basename "$f")"
                case "$base" in
                  OpenConsole.exe|elevate.exe) continue ;;
                esac
                cp -v "$f" staged/
              done
              ;;
            mac)
              find release -maxdepth 1 -type f \( \
                -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest-mac.yml' \
              \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
                cp -v "$f" staged/
              done
              ;;
            linux)
              find release -maxdepth 1 -type f \( \
                -name '*.AppImage' -o -name '*.deb' -o -name 'latest-linux.yml' \
              \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
                cp -v "$f" staged/
              done
              ;;
          esac
          echo "--- staged ---"
          ls -la staged || true
          count="$(find staged -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "staged file count=$count"
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::No installer artifacts staged for ${{ matrix.platform }}"
            exit 1
          fi

      - name: Upload artifacts to job
        if: steps.want.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: staged/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    # Publish whatever platforms succeeded (fail-fast is false on the matrix).
    needs: [verify, build]
    if: ${{ always() && !cancelled() && needs.verify.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist-packages
          pattern: packages-*
          merge-multiple: true
          # Manual mac-only rebuild: still OK if only one platform uploaded.
          # softprops will attach whatever is present to the existing tag.

      - name: List downloaded files
        run: |
          find dist-packages -type f | sort || true
          count="$(find dist-packages -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "downloaded count=$count"
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::No package artifacts downloaded — nothing to publish"
            exit 1
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ${{ needs.verify.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          # Append/replace assets on the existing release when re-run manually.
          files: |
            dist-packages/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
